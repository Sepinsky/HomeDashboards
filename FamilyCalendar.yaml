kiosk_mode:
  user_settings:
    - users:
        - Calendar
      kiosk: true
views:
  - type: panel
    path: weeklyplannercard
    title: WeeklyPlannerCard
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          margin: 0px 0px 0px 0px
          padding: 0px 0px 0px 0px
          grid-template-columns: auto 893px
          grid-template-rows: auto 360px
          height: 100%
        cards:
          - type: custom:week-planner-card
            view_layout:
              grid-column-start: 1
              grid-column-end: -1
              grid-row-start: 1
              grid-row-end: -1
            calendars:
              - entity: calendar.home_calendar
                color: '#08c5b0'
              - entity: calendar.holidays_in_united_states
                color: '#ff725c'
              - entity: calendar.joanne_sepinsky_com
                color: '#ff8ab7'
              - entity: calendar.home_calendar
              - entity: calendar.sepinsky_gmail_com
                color: '#9c6b4e'
              - entity: calendar.jason_sepinsky_com
                color: '#4269d0'
              - entity: calendar.pspgrama_gmail_com
                color: '#a463f2'
            days: '35'
            startingDayOffset: 0
            hideWeekend: false
            noCardBackground: true
            compact: false
            weather:
              showCondition: true
              showTemperature: true
              showLowTemperature: true
              useTwiceDaily: false
              entity: weather.pirateweather
            locale: en
            showLocation: false
            hidePastEvents: false
            hideDaysWithoutEvents: false
            hideTodayWithoutEvents: false
            combineSimilarEvents: false
            showLegend: false
            texts:
              fullDay: All Day
              noEvents: null
              tomorrow: null
              yesterday: null
              today: null
            columns: {}
            startingDay: sunday
            timeFormat: hh:mm
            card_mod:
              style: |
                .past {
                  opacity: .5;
                  color: #fcfcfc;
                }
                .today {
                  border: solid 1px red;
                  border-radius: 4px;
                }
                .day {
                  --days-spacing: 16px;
                  --event-padding: 2px;
                  --event-spacing: 4px;
                  --event-font-size: 2.2em;
                  --day-date-number-font-size: 5.5em;
                  --day-date-text-font-size: 2.25em;
                  --weather-temperature-font-size: 2em;
                  --weather-icon-size: 50px;
                }
                .none {
                  background-color: transparent !important;
                }
                .card-content {
                  overflow-y: clip;
                  max-height: 1400px;
                }
                :host {
                  --masonry-view-card-margin: 0px;
                }
          - type: custom:layout-card
            layout_type: custom:grid-layout
            view_layout:
              grid-column-start: 2
              grid-column-end: 3
              grid-row-start: 2
              grid-row-end: 3
            layout:
              margin: 0px 0px 0px 0px
              padding: 0px 0px 0px 0px
              grid-template-columns: 253px 190px 20px 42px 127px 42px 211px
              grid-template-rows: 53px 53px 106px 70px 70px
              height: 100%
            cards:
              - type: markdown
                content: ' '
                view_layout:
                  grid-column-start: 1
                  grid-column-end: 2
                  grid-row-start: 2
                  grid-row-end: 6
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - type: custom:power-flow-card-plus
                view_layout:
                  grid-column-start: 1
                  grid-column-end: 2
                  grid-row-start: 2
                  grid-row-end: 6
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 1px;
                      align-self: center;
                      z-index: 2;
                    }
                entities:
                  grid:
                    entity: sensor.envoy_482515044701_current_power_consumption
                    secondary_info: {}
                  solar:
                    entity: sensor.envoy_482515044701_current_power_production
                    display_zero_state: true
                    secondary_info: {}
                    icon: mdi:solar-power-variant
                  home:
                    secondary_info: {}
                display_zero_lines: true
                use_new_flow_rate_model: true
                w_decimals: 0
                kw_decimals: 1
                min_flow_rate: 0.75
                max_flow_rate: 5
                max_expected_power: 10000
                min_expected_power: 0.01
                watt_threshold: 1000
                transparency_zero_lines: 0
                sort_individual_devices: false
              - type: gauge
                entity: sensor.back_yard_weather_station_event_rain
                name: Total Rain
                max: 8
                view_layout:
                  grid-column-start: 2
                  grid-column-end: 3
                  grid-row-start: 1
                  grid-row-end: 3
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - type: markdown
                content: ' '
                view_layout:
                  grid-column-start: 3
                  grid-column-end: 6
                  grid-row-start: 2
                  grid-row-end: 5
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - clock_size: medium
                show_seconds: true
                type: clock
                view_layout:
                  grid-column-start: 3
                  grid-column-end: 6
                  grid-row-start: 1
                  grid-row-end: 2
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - type: custom:compass-card
                header:
                  title:
                    value: Wind
                    show: true
                  icon:
                    value: mdi:weather-windy
                    show: true
                indicator_sensors:
                  - sensor: sensor.back_yard_weather_station_wind_dir
                    indicator:
                      type: arrow_inward
                value_sensors:
                  - sensor: sensor.back_yard_weather_station_wind_speed
                    decimals: 1
                compass:
                  north:
                    show: true
                    offset: 0
                view_layout:
                  grid-column-start: 3
                  grid-column-end: 6
                  grid-row-start: 2
                  grid-row-end: 5
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 1px;
                      align-self: center;
                      z-index: 2;
                    }
              - type: gauge
                entity: sensor.back_yard_weather_station_hourly_rain_rate
                name: Rain Rate
                max: 5
                view_layout:
                  grid-column-start: 2
                  grid-column-end: 3
                  grid-row-start: 3
                  grid-row-end: 4
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - type: entity
                entity: sensor.back_yard_weather_station_max_gust
                name: Max Gust Today
                view_layout:
                  grid-column-start: 2
                  grid-column-end: 3
                  grid-row-start: 4
                  grid-row-end: 5
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                      }
                    .header {
                      padding: 0px 16px 0px !important;
                    }
              - type: entity
                entity: cover.garage_doors_garage_door_1
                name: Double Door
                view_layout:
                  grid-column-start: 2
                  grid-column-end: 4
                  grid-row-start: 5
                  grid-row-end: 6
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
                    .header {
                      padding: 0px 16px 0px !important;
                    }
                    ha-card {
                      color: {% if(states("cover.garage_doors_garage_door_1") in ('closed')) %}lightgreen{% else %}red{% endif %}
                    }
              - type: entity
                entity: cover.garage_doors_garage_door_2
                name: Single Door
                view_layout:
                  grid-column-start: 4
                  grid-column-end: 7
                  grid-row-start: 5
                  grid-row-end: 6
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
                    .header {
                      padding: 0px 16px 0px !important;
                    }
                    ha-card {
                      color: {% if(states("cover.garage_doors_garage_door_2") in ('closed')) %}lightgreen{% else %}red{% endif %}
                    }
              - type: entity
                entity: cover.pool_house_door_garage_door_1
                name: Pool House
                view_layout:
                  grid-column-start: 7
                  grid-column-end: 8
                  grid-row-start: 5
                  grid-row-end: 6
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
                    .header {
                      padding: 0px 16px 0px !important;
                    }
                    ha-card {
                      color: {% if(states("cover.pool_house_door_garage_door_1") in ('closed')) %}lightgreen{% else %}red{% endif %}
                    }
              - type: markdown
                content: ' '
                view_layout:
                  grid-column-start: 6
                  grid-column-end: 8
                  grid-row-start: 1
                  grid-row-end: 5
                card_mod:
                  style: |
                    :host {
                      --masonry-view-card-margin: 0px;
                      border: solid 1px #424447;
                      z-index: 2;
                    }
              - type: custom:flex-horseshoe-card
                view_layout:
                  grid-column-start: 6
                  grid-column-end: 8
                  grid-row-start: 1
                  grid-row-end: 5
                card_mod:
                  style:
                    .: |
                      :host {
                        --masonry-view-card-margin: 1px;
                        align-self: center;
                        z-index: 2;
                      }
                    .container:
                      .card--filter-none:
                        .datagroup: |
                          text:nth-child(15) .state__value {
                            {% if states('switch.pool_controller_pool_heat') == 'on' %}
                              fill: darkorange !important;
                            {% endif %}
                          }
                entities:
                  - entity: sensor.back_yard_weather_station_temp
                    decimals: 1
                    unit: °F
                    name: Outdoor Temp
                  - entity: sensor.back_yard_weather_station_humidity
                    decimals: 1
                    name: Outdoor humidity
                  - entity: sensor.back_yard_weather_station_humidity_in
                    decimals: 1
                    name: Indoor humidity
                  - entity: sensor.back_yard_weather_station_inside_temp
                    decimals: 1
                    unit: °F
                    name: Indoor
                  - entity: sensor.back_yard_weather_station_feels_like
                    decimals: 1
                    name: Feels Like
                  - entity: sensor.back_yard_weather_station_dew_point
                    decimals: 1
                    name: Dew Point
                  - entity: sensor.pool_temp
                    decimals: 1
                    unit: °F
                    name: Pool Temp
                show:
                  horseshoe_style: colorstopgradient
                layout:
                  hlines:
                    - id: 0
                      xpos: 50
                      ypos: 43
                      length: 76
                      styles:
                        - opacity: 0.2;
                    - id: 1
                      xpos: 50
                      ypos: 69
                      length: 68
                      styles:
                        - opacity: 0.2;
                  vlines:
                    - id: 0
                      xpos: 50
                      ypos: 66
                      length: 45
                      styles:
                        - opacity: 0.2;
                  states:
                    - id: 0
                      entity_index: 0
                      xpos: 50
                      ypos: 32
                      styles:
                        - font-size: 3em;
                        - opacity: 0.9;
                    - id: 1
                      entity_index: 1
                      xpos: 45
                      ypos: 55
                      styles:
                        - font-size: 1.8em;
                        - text-anchor: end;
                    - id: 2
                      entity_index: 2
                      xpos: 57
                      ypos: 55
                      styles:
                        - font-size: 1.8em;
                        - text-anchor: start;
                    - id: 3
                      entity_index: 3
                      xpos: 2
                      ypos: 7
                      styles:
                        - font-size: 1.5em;
                        - text-anchor: start;
                    - id: 4
                      entity_index: 6
                      xpos: 99
                      ypos: 7
                      styles:
                        - font-size: 1.5em;
                        - text-anchor: end;
                    - id: 5
                      entity_index: 5
                      xpos: 35
                      ypos: 82
                      styles:
                        - font-size: 1.5em;
                    - id: 6
                      entity_index: 4
                      xpos: 65
                      ypos: 82
                      styles:
                        - font-size: 1.5em;
                  names:
                    - id: 0
                      entity_index: 0
                      xpos: 50
                      ypos: 39
                      styles:
                        - font-size: 0.48em;
                    - id: 1
                      entity_index: 1
                      xpos: 46
                      ypos: 62
                      styles:
                        - font-size: 0.5em;
                        - text-anchor: end;
                    - id: 2
                      entity_index: 2
                      xpos: 54
                      ypos: 62
                      styles:
                        - font-size: 0.5em;
                        - text-anchor: start;
                    - id: 3
                      entity_index: 6
                      xpos: 79
                      ypos: 12
                      styles:
                        - font-size: 0.56em;
                        - text-anchor: start;
                    - id: 4
                      entity_index: 3
                      xpos: 2
                      ypos: 12
                      styles:
                        - font-size: 0.56em;
                        - text-anchor: start;
                    - id: 5
                      entity_index: 5
                      xpos: 35
                      ypos: 87
                      styles:
                        - font-size: 0.56em;
                    - id: 6
                      entity_index: 4
                      xpos: 65
                      ypos: 87
                      styles:
                        - font-size: 0.56em;
                horseshoe_scale:
                  min: -20
                  max: 105
                color_stops:
                  '20': '#4567EF'
                  '50': '#DBD037'
                  '90': '#D82039'
